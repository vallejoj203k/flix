<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flix Login</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           font-family: system-ui, sans-serif; color: #eee; padding: 16px;
           background: #141414 url('fondo.jpg') center / cover no-repeat fixed; }
    .card { background: rgba(0, 0, 0, 0.75); padding: 32px; border-radius: 8px; width: 100%; max-width: 360px; }
    h1 { margin: 0 0 20px; color: #e50914; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border: none; border-radius: 4px;
            background: #333; color: #fff; font-size: 15px; }
    .buttons { display: flex; gap: 8px; }
    button { flex: 1; padding: 12px; border: none; border-radius: 4px; font-size: 15px; cursor: pointer; }
    #login { background: #e50914; color: #fff; }
    #register { background: #444; color: #fff; }
    #msg { margin-top: 16px; min-height: 20px; font-size: 14px; }
    .ok { color: #46d369; } .err { color: #ff6b6b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Flix</h1>
    <input id="username" placeholder="Usuario" autocomplete="username">
    <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div class="buttons">
      <button id="login">Entrar</button>
      <button id="register">Registrarse</button>
    </div>
    <div id="msg"></div>
  </div>
  <script>
    const msg = document.getElementById('msg');
    async function send(url) {
      const body = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      };
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        });
        const data = await res.json();
        msg.className = res.ok ? 'ok' : 'err';
        msg.textContent = res.ok ? `${data.message}: ${data.user.username}` : data.error;
      } catch (e) {
        msg.className = 'err';
        msg.textContent = 'No se pudo conectar con el servidor';
      }
    }
    document.getElementById('login').onclick = () => send('/api/login');
    document.getElementById('register').onclick = () => send('/api/register');
  </script>
</body>
</html>
